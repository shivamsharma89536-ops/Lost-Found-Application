# --- Server Port ---
server.port=8080

# --- MySQL Database Connection ---
# Replace 'lostandfound' with your database name
# Replace 'root' and 'password' with your MySQL username and password
spring.datasource.url=jdbc:mysql://localhost:3306/lostandfound?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=password@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA Settings (Auto-creates tables) ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- File Upload Settings ---
# This is the folder where item images will be saved
# Make sure this folder exists on your computer!
# On Windows, it might be: "C:/uploads"
# On Mac/Linux, it might be: "/Users/yourname/uploads"
file.upload-dir=C:/College

# --- Security (JWT) ---
# This is your secret key. MAKE IT LONG AND RANDOM.
# You can generate one from https://www.allkeysgenerator.com/ (e.g., 256-bit AES)

#my-super-secret-lost-and-found-app-key-is-very-secure-2025!
jwt.secret=bXktc3VwZXItc2VjcmV0LWxvc3QtYW5kLWZvdW5kLWFwcC1rZXktaXMtdmVyeS1zZWN1cmUtMjAyNSE= 

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# Fixes LazyInitializationException during JSON serialization
spring.jpa.open-in-view=true